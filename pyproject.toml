[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "softcut"
version = "0.1.0"
description = "Rating-aligned AI video safe-cut MVP engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
analysis-ml = [
  "numpy<2",
  "scenedetect>=0.6,<1",
  "opennsfw2>=0.10,<1",
  "transformers<5",
  "openai-whisper>=20231117",
  "whisperx>=3,<4",
]
ingest = [
  "yt-dlp>=2024.11",
]

[project.scripts]
softcut-build-timeline = "engine.analysis.build_timeline:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["apps*", "engine*"]
