project:
  name: softcut-local

analysis_run:
  # Keep this stable to overwrite one artifact folder run-to-run.
  job_id: local_from_config_001

  source:
    # one of: input | url | url_file
    mode: url_file
    input_video_path: data/inbox/input.mp4
    url: https://www.youtube.com/watch?v=7cLTW934VR8
    url_file: data/inbox/url.txt

  paths:
    artifacts_root: artifacts
    work_root: data/work
    download_dir: data/inbox

  settings:
    diarize: false
    # Optional overrides; null means use configs/analysis.yaml runtime defaults.
    overwrite_job_artifacts: null
    prune_other_artifacts: null
    keep_artifact_jobs: null
    analysis_config_path: configs/analysis.yaml
